<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Big Brother · Clients Editor</title>
  <style>
    :root{--ink:#17212b;--muted:#6b7785;--line:#dfe5ea;--bg:#f4f7f8;--card:#fff;--brand:#176b52;--brand2:#25a071;--danger:#b42318;--shadow:0 12px 30px rgba(28,45,55,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#102d26;color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{padding:0 10px 28px}.brand strong{display:block;font-size:22px;letter-spacing:.05em}.brand span{font-size:12px;color:#b5d4cb}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#cde0da;text-align:left;padding:13px 14px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:#1c4a3e;color:#fff}.main{padding:30px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.top h1{margin:0 0 5px;font-size:28px}.sub{color:var(--muted)}.status{font-size:13px;padding:8px 12px;border-radius:999px;background:#e8f5ef;color:var(--brand)}
    .panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:650;font-size:13px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #ccd6dc;border-radius:10px;background:#fff;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(37,160,113,.13)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#e9efed;color:#24443a}.danger{color:var(--danger)}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 260px auto;gap:12px;margin-bottom:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafb}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f7fbf9}.link{border:0;background:none;color:var(--brand);font-weight:750;cursor:pointer;padding:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;background:#e7f5ee;color:#176b52}.pill.off{background:#f1f1f1;color:#69727b}.empty{text-align:center;color:var(--muted);padding:42px}.price-head{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px;margin-bottom:16px}.price-input{width:130px;border:1px solid #ccd6dc;border-radius:8px;padding:8px}.toast{position:fixed;right:22px;bottom:22px;background:#16251f;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:20}.toast.show{display:block}.toast.error{background:#8f1f18}.loading{opacity:.55;pointer-events:none}
    @media(max-width:850px){.app{display:block}.side{position:static;height:auto;padding:16px}.brand{padding:0 6px 14px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:10px 6px;font-size:12px}.main{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar,.price-head{grid-template-columns:1fr}.top{display:block}.status{display:inline-block;margin-top:10px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><strong>BIG BROTHER</strong><span>MASTER DATABASE · CLIENTS</span></div>
    <nav class="nav">
      <button class="active" data-page="add">＋ Add Client</button>
      <button data-page="prices">Products & Price</button>
      <button data-page="clients">All Client Detail</button>
    </nav>
  </aside>
  <main class="main" id="main">
    <header class="top"><div><h1 id="pageTitle">Add Client</h1><div class="sub" id="pageSub">Create a new customer record in the Master Database.</div></div><span class="status" id="apiStatus">Connecting…</span></header>

    <section class="panel active" id="page-add">
      <form class="card" id="clientForm">
        <input type="hidden" id="originalClientId">
        <div class="grid">
          <div class="field"><label for="clientId">Client ID / Code *</label><input id="clientId" required placeholder="e.g. C0001"></div>
          <div class="field"><label for="clientName">Client Name *</label><input id="clientName" required placeholder="Customer or company name"></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" placeholder="Phone number"></div>
          <div class="field"><label for="contactPerson">Contact Person</label><input id="contactPerson" placeholder="Main contact"></div>
          <div class="field"><label for="paymentTerm">Payment Term</label><input id="paymentTerm" placeholder="e.g. 7 Days / COD"></div>
          <div class="field"><label for="currency">Default Currency</label><select id="currency"><option>USD</option><option>KHR</option></select></div>
          <div class="field"><label for="active">Status</label><select id="active"><option value="TRUE">Active</option><option value="FALSE">Inactive</option></select></div>
          <div class="field full"><label for="address">Address</label><textarea id="address" rows="3" placeholder="Client address"></textarea></div>
          <div class="field full"><label for="note">Note</label><textarea id="note" rows="3" placeholder="Internal note"></textarea></div>
        </div>
        <div class="actions"><button type="button" class="btn secondary" id="resetBtn">Clear</button><button class="btn primary" id="saveClientBtn">Save Client</button></div>
      </form>
    </section>

    <section class="panel" id="page-prices">
      <div class="card">
        <div class="price-head"><select class="search" id="priceClient"><option value="">Select a client…</option></select><button class="btn primary" id="savePricesBtn">Save Product Prices</button></div>
        <div class="table-wrap"><table><thead><tr><th>Product Code</th><th>Product Name</th><th>Unit</th><th>Price</th><th>Currency</th><th>Active</th></tr></thead><tbody id="priceRows"><tr><td colspan="6" class="empty">Select a client to manage product prices.</td></tr></tbody></table></div>
      </div>
    </section>

    <section class="panel" id="page-clients">
      <div class="card">
        <div class="toolbar"><input class="search" id="clientSearch" placeholder="Search client name, code, phone…"><select class="search" id="statusFilter"><option value="">All statuses</option><option value="TRUE">Active</option><option value="FALSE">Inactive</option></select><button class="btn secondary" id="refreshBtn">Refresh</button></div>
        <div class="table-wrap"><table><thead><tr><th>Client ID</th><th>Client Name</th><th>Phone</th><th>Payment Term</th><th>Currency</th><th>Status</th><th></th></tr></thead><tbody id="clientRows"></tbody></table></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyM5mUlz5SeMZ_oPJCo2FgLkPEcodAQ7wPl5wxAdrvfqLvsZLaHxiOtS02L1Q3ZRA3D/exec';
const state={clients:[],products:[],prices:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pages={add:['Add Client','Create a new customer record in the Master Database.'],prices:['All Clients Products & Price','Manage each client’s agreed product prices.'],clients:['All Client Detail','Search, review, and edit existing client records.']};
function toast(message,error=false){const t=$('#toast');t.textContent=message;t.className='toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className='toast',3500)}
function busy(on){$('#main').classList.toggle('loading',on)}
async function api(action,payload={}){const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});const data=await res.json();if(!data.ok)throw new Error(data.error||'Request failed');return data}
function showPage(name){$$('.panel').forEach(x=>x.classList.remove('active'));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===name));$('#page-'+name).classList.add('active');$('#pageTitle').textContent=pages[name][0];$('#pageSub').textContent=pages[name][1]}
$$('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function normalizeBool(v){return String(v).toUpperCase()==='TRUE'||v===true}
function renderClients(){const q=$('#clientSearch').value.trim().toLowerCase(),f=$('#statusFilter').value;const rows=state.clients.filter(c=>(!q||[c.clientId,c.clientName,c.phone,c.contactPerson].join(' ').toLowerCase().includes(q))&&(!f||String(normalizeBool(c.active)).toUpperCase()===f));$('#clientRows').innerHTML=rows.length?rows.map(c=>`<tr><td>${esc(c.clientId)}</td><td><strong>${esc(c.clientName)}</strong></td><td>${esc(c.phone||'—')}</td><td>${esc(c.paymentTerm||'—')}</td><td>${esc(c.currency||'USD')}</td><td><span class="pill ${normalizeBool(c.active)?'':'off'}">${normalizeBool(c.active)?'Active':'Inactive'}</span></td><td><button class="link" data-edit="${esc(c.clientId)}">Edit</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No clients found.</td></tr>';$$('[data-edit]').forEach(b=>b.onclick=()=>editClient(b.dataset.edit))}
function fillClientOptions(){const v=$('#priceClient').value;$('#priceClient').innerHTML='<option value="">Select a client…</option>'+state.clients.map(c=>`<option value="${esc(c.clientId)}">${esc(c.clientId)} — ${esc(c.clientName)}</option>`).join('');$('#priceClient').value=v}
function editClient(id){const c=state.clients.find(x=>x.clientId===id);if(!c)return;['clientId','clientName','phone','contactPerson','paymentTerm','currency','active','address','note'].forEach(k=>$('#'+k).value=k==='active'?(normalizeBool(c[k])?'TRUE':'FALSE'):(c[k]??''));$('#originalClientId').value=c.clientId;$('#clientId').readOnly=true;$('#saveClientBtn').textContent='Update Client';showPage('add')}
function resetForm(){$('#clientForm').reset();$('#originalClientId').value='';$('#clientId').readOnly=false;$('#saveClientBtn').textContent='Save Client'}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){busy(true);try{const d=await api('clientEditorBootstrap');state.clients=d.clients||[];state.products=d.products||[];renderClients();fillClientOptions();$('#apiStatus').textContent=`Connected · ${state.clients.length} clients`}catch(e){$('#apiStatus').textContent='Connection error';toast(e.message,true)}finally{busy(false)}}
$('#clientSearch').oninput=renderClients;$('#statusFilter').onchange=renderClients;$('#refreshBtn').onclick=load;$('#resetBtn').onclick=resetForm;
$('#clientForm').onsubmit=async e=>{e.preventDefault();const client={};['clientId','clientName','phone','contactPerson','paymentTerm','currency','active','address','note'].forEach(k=>client[k]=$('#'+k).value.trim());busy(true);try{await api('clientEditorSaveClient',{client,originalClientId:$('#originalClientId').value});toast($('#originalClientId').value?'Client updated.':'Client added.');resetForm();await load();showPage('clients')}catch(x){toast(x.message,true)}finally{busy(false)}};
$('#priceClient').onchange=async()=>{const id=$('#priceClient').value;if(!id){$('#priceRows').innerHTML='<tr><td colspan="6" class="empty">Select a client to manage product prices.</td></tr>';return}busy(true);try{const d=await api('clientEditorPrices',{clientId:id});state.prices=d.prices||[];const map=Object.fromEntries(state.prices.map(p=>[p.productCode,p]));$('#priceRows').innerHTML=state.products.map(p=>{const x=map[p.productCode]||{};return `<tr data-product="${esc(p.productCode)}"><td>${esc(p.productCode)}</td><td><strong>${esc(p.productName)}</strong></td><td>${esc(p.unit||'')}</td><td><input class="price-input js-price" type="number" min="0" step="0.0001" value="${Number(x.price||x.purchasePrice||0)}"></td><td><select class="price-input js-currency"><option ${String(x.currency||'USD')==='USD'?'selected':''}>USD</option><option ${String(x.currency)==='KHR'?'selected':''}>KHR</option></select></td><td><input class="js-active" type="checkbox" ${x.active===undefined||normalizeBool(x.active)?'checked':''}></td></tr>`}).join('')}catch(e){toast(e.message,true)}finally{busy(false)}};
$('#savePricesBtn').onclick=async()=>{const clientId=$('#priceClient').value;if(!clientId)return toast('Please select a client.',true);const prices=$$('#priceRows tr[data-product]').map(r=>({clientId,productCode:r.dataset.product,price:Number(r.querySelector('.js-price').value||0),currency:r.querySelector('.js-currency').value,active:r.querySelector('.js-active').checked}));busy(true);try{await api('clientEditorSavePrices',{clientId,prices});toast('Product prices saved.')}catch(e){toast(e.message,true)}finally{busy(false)}};
load();
</script>
</body>
</html>
